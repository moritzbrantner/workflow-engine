name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    outputs:
      allow-skipped: ${{ steps.merge-scope.outputs.allow-skipped }}
      validate-pages: ${{ steps.merge-scope.outputs.validate-pages }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Determine required PR validation scope
        id: merge-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]).decode().split("\0")
          filters = {'validate-pages': {'paths': ['web/**', '.github/workflows/pages.yml'], 'branches': None}}
          def matches(path, pattern):
              pattern = re.escape(pattern).replace(r"\*\*", ".*").replace(r"\*", "[^/]*").replace(r"\?", "[^/]")
              return re.fullmatch(pattern, path) is not None
          skipped = []
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, scope in filters.items():
                  matches_paths = scope["paths"] is None or any(matches(path, pattern) for path in paths if path for pattern in scope["paths"])
                  matches_branch = scope["branches"] is None or any(matches(os.environ["BASE_BRANCH"], pattern) for pattern in scope["branches"])
                  required = matches_paths and matches_branch
                  print(f"{name}={str(required).lower()}", file=output)
                  if not required:
                      skipped.append(name)
              print("allow-skipped=" + json.dumps(skipped), file=output)
          PYTHON
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run verify

  validate-pages:
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.outputs.validate-pages == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  merge-ready:
    name: merge-ready
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: ["verify", "validate-pages"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["verify", "validate-pages"]'
          allow-skipped: ${{ needs.verify.outputs.allow-skipped || '[]' }}
